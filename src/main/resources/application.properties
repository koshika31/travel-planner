spring.application.name=travel-planner
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/travel_planner
spring.datasource.username=${DB_USERNAME:travelplanner}
spring.datasource.password=${DB_PASSWORD:travelplanner}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
server.servlet.session.cookie.same-site=lax
